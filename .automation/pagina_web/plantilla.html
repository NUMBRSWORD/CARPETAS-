<script>
'use strict';
const KEY='carpetas_ventanilla_v1';
const SIGLAS='COMOPPOL-PNP/DIRNOS/REGPOL-CALL/DIVOPUS-VENTANILLA-COM VENTANILLA.SEC';
const ASSETS=JSON.parse(document.getElementById('assets').textContent);
const BASE=JSON.parse(document.getElementById('base').textContent);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const isISO=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return false;const d=new Date(v+'T00:00:00');return !isNaN(d)&&d.toISOString!==undefined&&d.getDate()===+v.slice(8)};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const corta=v=>isISO(v)?v.slice(8)+'/'+v.slice(5,7)+'/'+v.slice(0,4):(v||'');
const larga=v=>isISO(v)?(+v.slice(8))+' de '+MESES[+v.slice(5,7)-1]+' de '+v.slice(0,4):'';

const EFECTIVOS=JSON.parse(document.getElementById('efectivos').textContent);
let store={edits:{},nuevos:[],cfg:{aviso:7},efectivos:EFECTIVOS};
let persistente=true;
// Abierta con ABRIR EN CHROME.bat, los datos vienen de la base de datos de esta PC; abierta como archivo, de este Chrome.
const SRV=JSON.parse(document.getElementById('servidor').textContent);
let srvVersion=SRV?SRV.version:0;
const desdeGuardado=s=>({edits:s.edits||{},nuevos:s.nuevos||[],cfg:{aviso:7,...(s.cfg||{})},efectivos:s.efectivos||EFECTIVOS});
if(SRV){if(SRV.store)store=desdeGuardado(SRV.store)}
else try{const raw=localStorage.getItem(KEY);if(raw)store=desdeGuardado(JSON.parse(raw))}catch(e){persistente=false}
const PERSONALIZACION=JSON.parse(document.getElementById('personalizacion')?.textContent||'{}');
const FIRMA_DEF={fCip:'',fNom:'',fGra:'',fCar:'',iFir:'',...(PERSONALIZACION.firma||{})};
// Una sola vez por navegador: pone el firmante y los datos de la lista de personal, sin perder quién está activo ni su cargo.
function aplicarPersonal(s){
  if(s.cfg.personalV>=1)return s;
  Object.assign(s.cfg,FIRMA_DEF);
  const clave=e=>String(e.nombre).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().split(/\s+/);
  const lista=[...s.efectivos];
  for(const p of EFECTIVOS){
    const k=clave(p),igual=x=>{const o=clave(x);return o[0]===k[0]&&o[1]===k[1]};
    const parecidos=EFECTIVOS.filter(igual);
    const e=lista.find(x=>igual(x)&&(parecidos.length<2||clave(x)[2]===k[2]));
    if(e&&e!==p){const {id,activo,cargo}=e;Object.assign(e,p,{id,activo,cargo:cargo||p.cargo})}
    else if(!e)lista.push(p);
  }
  s.efectivos=lista;s.cfg.personalV=1;
  return s;
}
store=aplicarPersonal(store);
__PERSISTENCIA__
iniciarRecuperacion();

let recs,byId,ADIC;
function cargar(){
  const todos=BASE.map(r=>({...r,...(store.edits[r.id]||{})})).concat(store.nuevos.map(n=>({...n,...(store.edits[n.id]||{})})));
  // Los decretos adicionales (adic = carpeta de origen) solo salen en Decretos; no son carpetas.
  recs=todos.filter(r=>!r.adic);ADIC=todos.filter(r=>r.adic);
  byId=new Map(todos.map(r=>[r.id,r]));
}
function setField(id,k,v){const r=byId.get(id);if(!r)return;const m=new Date().toISOString();r[k]=v;r._mod=m;Object.assign(store.edits[id]=store.edits[id]||{},{[k]:v,_mod:m});save()}
const fechaHora=v=>{if(!v)return '';const d=new Date(v);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
// Lo editado antes de guardar la hora va después de lo que sí la tiene, por fecha de entrega.
const tocada=r=>store.edits[r.id]||!r.hoja?1:0;
const porModificacion=(a,b)=>String(b._mod||'').localeCompare(String(a._mod||''))||tocada(b)-tocada(a)||(tocada(a)?String(b.ent||'').localeCompare(String(a.ent||'')):0);

const control=()=>isISO(store.cfg.control)?store.cfg.control:today();
// La Fiscalía no da vigencia, solo pide informar el avance de forma periódica (CF 257-2026).
const informePeriodico=r=>!r.venc&&/PERI[OÓ]DIC/i.test(r.plazo||'');
function vigencia(r){
  if(!(r.sec||r.cf||r.resp||r.rec||r.plazo||r.ofi||r.fis||r.imp||r.del))return 'SIN DATOS';
  if(r.rem==='SÍ')return 'DESCARGADO';
  if(r.rem==='DEVUELTA/ARCHIVADA')return 'DEVUELTA/ARCHIVADA';
  // Sin descargo anotado en el archivo: manda la fecha, como en cualquier carpeta pendiente.
  const sinEstado=r.rem!=='NO';
  if(sinEstado&&(!r.venc||!isISO(r.venc)))return 'SIN ESTADO';
  if(informePeriodico(r))return 'INFORME PERIÓDICO';
  if(!r.venc)return (String(r.amp||'').trim()||/AMPLI|PRORRO/i.test((r.plazo||'')+' '+(r.obs||'')))?'CONFIRMAR AMPLIACIÓN':'CONFIRMAR VENCIMIENTO';
  if(!isISO(r.venc))return 'FECHA INVÁLIDA';
  const c=control();
  if(r.venc<c)return 'VENCIDA';
  if(r.venc===c)return 'VENCE HOY';
  return r.venc<=addDays(c,+store.cfg.aviso||0)?'POR VENCER':'VIGENTE';
}
const TAG={'VENCIDA':'t-red','FECHA INVÁLIDA':'t-red','VENCE HOY':'t-amber','POR VENCER':'t-amber','CONFIRMAR AMPLIACIÓN':'t-amber','CONFIRMAR VENCIMIENTO':'t-amber','INFORME PERIÓDICO':'t-blue','SIN ESTADO':'t-blue','VIGENTE':'t-green','DESCARGADO':'t-gray','DEVUELTA/ARCHIVADA':'t-gray','SIN DATOS':'t-gray'};
const tag=v=>'<span class="tag '+(TAG[v]||'t-gray')+'">'+esc(v)+'</span>';
const ORDEN={'VENCIDA':0,'VENCE HOY':1,'POR VENCER':2,'FECHA INVÁLIDA':3,'CONFIRMAR AMPLIACIÓN':4,'CONFIRMAR VENCIMIENTO':5,'VIGENTE':6,'INFORME PERIÓDICO':6,'SIN ESTADO':7,'SIN DATOS':8,'DEVUELTA/ARCHIVADA':9,'DESCARGADO':10};

const pendiente=r=>r.rem!=='SÍ'&&r.rem!=='DEVUELTA/ARCHIVADA';

const GRUPOS=[
 ['Oficio fiscal',[['sec','Sección','sel',['FAMILIA','DELITOS','TRÁNSITO']],['cf','Carpeta fiscal'],['ofi','Oficio recibido'],['fofi','Fecha del oficio','date'],['fis','Fiscalía / despacho'],['imp','Imputado'],['del','Delito'],['agr','Agraviado']]],
 ['Recepción y plazo',[['rec','Recepción en Mesa de Partes','date'],['hrec','Hora de recepción','time'],['nreg','N.° de registro de ingreso'],['frec','Folios recibidos'],['rcp','Recepcionado por'],['sell','Recepción sellada y firmada','sel',['','SÍ','NO']],['plazo','Plazo del oficio'],['amp','Ampliación','area'],['aper','Apersonamientos','area'],['venc','Vencimiento vigente','date'],['vori','Fecha de vencimiento en la columna del archivo']]],
 ['Decreto',[['resp','Responsable'],['grado','Grado del responsable'],['cip','CIP del responsable'],['cargo','Cargo del responsable'],['dec','N.° de decreto'],['fdec','Fecha del decreto','date'],['disp','Disposición (opcional, reemplaza el texto del decreto)','area'],['decf','Decreto firmado por el jefe','sel',['','SÍ','NO']]]],
 ['Entrega con cargo',[['ent','Fecha de entrega','date'],['hent','Hora de entrega','time'],['fent','Folios entregados'],['entp','Entregado por'],['carf','Cargo firmado','sel',['','SÍ','NO']],['ucar','Ubicación del cargo']]],
 ['Resultado',[['doc','Documento formulado','area'],['obs','Observación','area'],['rem','Descargada','sel',['NO','SÍ','DEVUELTA/ARCHIVADA','POR VERIFICAR']],['ubi','Ubicación / enlace']]],
 ['Memorándum',[['mnum','N.° de memorándum'],['mfec','Fecha del memorándum','date'],['pvig','Plazo vigente'],['ofvig','Oficio o disposición vigente']]]
];
function campo(r,[k,label,tipo,ops],scope){
  const v=r[k]??'';
  const id='f_'+scope+'_'+k;
  const attrs='id="'+id+'" data-k="'+k+'"';
  if(tipo==='sel'){
    const lista=ops.includes(v)?ops:[v,...ops];
    return '<label>'+esc(label)+'<select '+attrs+'>'+lista.map(o=>'<option value="'+esc(o)+'"'+(o===v?' selected':'')+'>'+esc(o||'—')+'</option>').join('')+'</select></label>';
  }
  if(tipo==='area')return '<label class="wide">'+esc(label)+'<textarea '+attrs+'>'+esc(v)+'</textarea></label>';
  if(tipo==='date'&&v&&!isISO(v))return '<label>'+esc(label)+' · fecha mal escrita, corrígela como aaaa-mm-dd<input class="bad" '+attrs+' value="'+esc(v)+'"></label>';
  return '<label>'+esc(label)+'<input type="'+(tipo==='date'?'date':tipo==='time'?'time':'text')+'" '+attrs+' value="'+esc(v)+'"></label>';
}

const S={view:'resumen',q:'',sec:'',hoja:'',vig:'',orden:'mod',page:0,cur:null,doc:'decreto'};
const NAV=[['resumen','Resumen'],['carpetas','Carpetas'],['asignar','Por asignar'],['decretos','Decretos'],['archivos','Archivos'],['recibidos','Recibidos'],['vencidas','Vencidas'],['lote','Subir oficios'],['efectivos','Efectivos'],['estadistica','Estadística'],['docs','Documentos'],['ajustes','Ajustes'],['guia','Guía']];
const pantallaMovil=()=>!!window.matchMedia?.('(max-width:640px)').matches;
function ir(view,extra){const menu=$('menuMovil'),desdeMenu=menu?.open;if(desdeMenu)menu.close();if(extra&&view==='carpetas'&&!('sinResponsable' in extra))S.sinResponsable=false;Object.assign(S,{view},extra||{});render();window.scrollTo(0,0);if(desdeMenu)$('app').focus({preventScroll:true})}
const ICONOS_MOVIL={resumen:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/>',carpetas:'<path d="M3 7V5a1 1 0 0 1 1-1h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/>',vencidas:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const iconoMovil=k=>'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONOS_MOVIL[k]+'</svg>';
function navegacionMovil(cuentas){
  const activa=S.view==='ficha'?'carpetas':S.view,principales=['resumen','carpetas','vencidas'];
  $('navMovil').innerHTML=[['resumen','Inicio'],['carpetas','Carpetas'],['vencidas','Vencidas'],['menu','Menú']].map(([k,t])=>'<button '+(k==='menu'?'id="abrirMenu" aria-haspopup="dialog" aria-controls="menuMovil"':'data-nav="'+k+'"')+(activa===k?' aria-current="page"':'')+(k==='menu'&&!principales.includes(activa)?' class="seccion-activa"':'')+'>'+iconoMovil(k)+'<span>'+t+'</span></button>').join('');
  $('menuSecciones').innerHTML=NAV.map(([k,t])=>'<button class="btn'+(activa===k?' seccion-activa':'')+'" data-nav="'+k+'"'+(activa===k?' aria-current="page"':'')+'><span>'+t+'</span>'+(cuentas[k]?'<span class="menu-cuenta">'+cuentas[k]+'</span>':'')+'</button>').join('');
}
function render(){
  actualizarControl();
  const pendientesNav=porAsignar().length,memosNav=vencidasNuevas(),decretosNav=porDescargar().length;
  $('nav').innerHTML=NAV.map(([k,t])=>'<button data-nav="'+k+'"'+(S.view===k||(k==='carpetas'&&S.view==='ficha')?' aria-current="page"':'')+'>'+t+(k==='asignar'&&pendientesNav?' ('+pendientesNav+')':'')+(k==='vencidas'&&memosNav?' ('+memosNav+(memosNav===1?' nueva)':' nuevas)'):'')+(k==='recibidos'&&nuevosRec()?' ('+nuevosRec()+')':'')+(k==='decretos'&&decretosNav?' ('+decretosNav+')':'')+'</button>').join('');
  navegacionMovil({asignar:pendientesNav,vencidas:memosNav,decretos:decretosNav,recibidos:nuevosRec()});
  ({resumen:vResumen,carpetas:vCarpetas,ficha:vFicha,docs:vDocs,archivos:vArchivos,ajustes:vAjustes,lote:vLote,efectivos:vEfectivos,vencidas:vVencidas,asignar:vAsignar,decretos:vDecretos,recibidos:vRecibidos,guia:vGuia,estadistica:vEstadistica})[S.view]();
}

const cabecera=(ey,t,sub)=>'<div class="view-header"><div><span class="eyebrow">'+esc(ey)+'</span><h2>'+esc(t)+'</h2>'+(sub?'<p class="view-subtitle">'+esc(sub)+'</p>':'')+'</div></div>';
function vResumen(){
  const n={},cuentaEtapas={};let pend=0;const porResp=new Map();
  for(const r of recs){const etapa=etapaActual(r);cuentaEtapas[etapa]=(cuentaEtapas[etapa]||0)+1}
  for(const r of recs){const v=vigencia(r);n[v]=(n[v]||0)+1;if(pendiente(r)){pend++;const e=porResp.get(r.resp||'(sin responsable)')||{p:0,v:0};e.p++;if(v==='VENCIDA')e.v++;porResp.set(r.resp||'(sin responsable)',e)}}
  const card=(num,txt,vig)=>'<button class="card'+(vig==='VENCIDA'&&num?' urgente':'')+'" data-vig="'+esc(vig)+'"><b>'+num.toLocaleString('es-PE')+'</b><span>'+esc(txt)+'</span></button>';
  const porHoja=new Map();
  for(const r of recs)if(vigencia(r)==='VENCIDA'){const e=porHoja.get(r.hoja||'(nuevas)')||{v:0,d:0};e.v++;if(String(r.doc||'').trim())e.d++;porHoja.set(r.hoja||'(nuevas)',e)}
  const hojas=[...porHoja.entries()].sort((a,b)=>b[1].v-a[1].v);
  const top=[...porResp.entries()].sort((a,b)=>b[1].v-a[1].v||b[1].p-a[1].p).slice(0,12);
  $('app').innerHTML=cabecera('Control de plazos','Resumen','Carpetas recibidas desde el 01/01/2026 · fecha de control: '+corta(control())+' · aviso con '+store.cfg.aviso+' días de anticipación')+'<div class="cards">'+
    card(recs.length,'Carpetas registradas','')+card(pend,'Pendientes','__PEND')+'<button class="card'+(porAsignar().length?' urgente':'')+'" data-nav="asignar"><b>'+porAsignar().length+'</b><span>Por asignar</span></button>'+'<button class="card" data-nav="decretos"><b>'+porDescargar().length+'</b><span>Decretos no descargados</span></button>'+'<button class="card'+(vencidasNuevas()?' urgente':'')+'" data-nav="vencidas"><b>'+vencidasNuevas()+'</b><span>Vencidas sin memorándum</span></button>'+card(n['VENCIDA']||0,'Vencidas','VENCIDA')+
    card((n['VENCE HOY']||0)+(n['POR VENCER']||0),'Vencen hoy o pronto','__PRONTO')+card(n['VIGENTE']||0,'Vigentes','VIGENTE')+
    card((n['CONFIRMAR AMPLIACIÓN']||0)+(n['CONFIRMAR VENCIMIENTO']||0)+(n['FECHA INVÁLIDA']||0),'Plazo por confirmar','__PLAZO')+card(n['SIN ESTADO']||0,'Sin estado ni fecha válida','SIN ESTADO')+card(n['DESCARGADO']||0,'Descargadas','DESCARGADO')+card(n['DEVUELTA/ARCHIVADA']||0,'Devueltas o archivadas','DEVUELTA/ARCHIVADA')+
    '</div><div class="panel"><h2>Carpetas por etapa</h2><div class="scroll"><table><thead><tr><th>Etapa actual</th><th class="num">Carpetas</th></tr></thead><tbody>'+

function filtrados(){
  const terminos=nrm(S.q).split(' ').filter(Boolean);
  const lista=recs.filter(r=>{
    if(S.sec&&r.sec!==S.sec)return false;
    if(S.hoja==='__NUEVAS'?!!r.hoja:(S.hoja&&r.hoja!==S.hoja))return false;
    if(S.sinResponsable&&String(r.resp||'').trim())return false;
    if(S.etapa&&etapaActual(r)!==S.etapa)return false;
    const v=vigencia(r);
    if(S.vig==='__PEND'&&!pendiente(r))return false;
    if(S.vig==='__PRONTO'&&v!=='VENCE HOY'&&v!=='POR VENCER')return false;
    if(S.vig==='__PLAZO'&&!['CONFIRMAR AMPLIACIÓN','CONFIRMAR VENCIMIENTO','FECHA INVÁLIDA'].includes(v))return false;
    if(S.vig&&!S.vig.startsWith('__')&&v!==S.vig)return false;
    if(terminos.length){const texto=nrm([r.id,r.cf,r.resp,r.ofi,r.imp,r.agr,r.fis,r.del,r.doc,r.obs,r.aper,r.sec].join(' '));if(!terminos.every(t=>texto.includes(t)))return false;}
    return true;
  });
  return lista.map(r=>({r,v:vigencia(r)})).sort((a,b)=>(S.orden==='venc'?0:porModificacion(a.r,b.r))||ORDEN[a.v]-ORDEN[b.v]||(a.v==='VENCIDA'?String(b.r.venc||'').localeCompare(String(a.r.venc||'')):String(a.r.venc||'9').localeCompare(String(b.r.venc||'9'))));
}

// En el registro el responsable suele venir con el grado ("S2 PNP APELLIDOS"): se separa para no repetirlo.
function partes(r){
  const resp=String(r.resp||'').trim(),m=resp.match(/^(.{1,20}?\bPNP)\s+(.+)$/);
  return {grado:String(r.grado||'').trim()||(m?m[1]:''),nombre:m?m[2]:resp};
}
function persona(r){const p=partes(r);return [p.grado,p.nombre].filter(Boolean).join(' ')}
// El número del oficio o carpeta puede traer ya su prefijo ("OF. N° 12-2025", "EXP. N° 34-2025").
function oficioTxt(v,t){v=String(v||'').trim();return v&&/^OF/i.test(v)?esc(v):'Oficio N.° '+ph(v,t)}
function carpetaTxt(v,t){v=String(v||'').trim();if(/^EXP/i.test(v))return 'expediente '+esc(v.replace(/^EXP\.?\s*/i,''));v=v.replace(/^C\.?\s?F\.?\s*(?=N)/i,'');return v&&/^(EXP|C\.?\s?F|CARP|CASO)/i.test(v)||/N[°º]/.test(v)?'carpeta fiscal '+esc(v):'carpeta fiscal N.° '+ph(v,t)}
// La columna de ampliación también guarda otras anotaciones ("REMITIR EN 48 HRS"): cuenta solo si la nota lo dice.
function ampliada(r){return /AMPL|PRORR/i.test(String(r.obs||'')+' '+String(r.amp||''))}
function plazoVigente(r){return r.pvig||(ampliada(r)?'':r.plazo)}

function cargarRespaldo(file){
  if(file.size>128*1024*1024)return alert('Este respaldo supera los 128 MB. Conserva el archivo para una recuperación local.');
  const fr=new FileReader();
  fr.onerror=()=>alert('No se pudo leer el archivo. Intenta seleccionarlo de nuevo.');
  fr.onload=async()=>{
    let iniciada=false;
    try{
      const s=JSON.parse(fr.result);
      validarRespaldo(s);
      if(!confirm('Esto reemplaza los datos guardados '+(SRV?'en la base de datos de esta PC':'en este navegador')+' por los del respaldo'+(Array.isArray(s.adjuntos)?', con sus '+s.adjuntos.length+' documentos':'')+'. ¿Continuar?'))return;
      const nuevo=aplicarPersonal({edits:s.edits,nuevos:s.nuevos,cfg:{aviso:7,...(s.cfg||{})},efectivos:s.efectivos||EFECTIVOS});
      for(const id of ['app','nav','navMovil','menuMovil'])$(id).inert=true;
      if(SRV){
        await restaurarEnServidor(nuevo,s.adjuntos);
      }else{
        await guardarAhora();
        descargar('respaldo_antes_de_restaurar_'+today()+'.json','application/json',JSON.stringify(store));
        iniciada=true;await subirAdjuntosRespaldo(s.adjuntos);store=nuevo;save();
      }
      cargar();ir('resumen');
    }catch(e){alert((iniciada?'La restauración en este navegador no terminó. Algunos documentos pueden haberse copiado. ':'')+(e.message||'No se pudo leer el respaldo.'))}finally{for(const id of ['app','nav','navMovil','menuMovil'])$(id).inert=false;if($('bkUp'))$('bkUp').value=''}
  };
  fr.readAsText(file);
}

function onField(e){

  if(t.id==='lfAuto'){LF.auto=t.checked;return}
  if(t.id==='lfSeparar'){LF.separar=t.value==='si';return}
  if(t.dataset.lfcarp!==undefined){const f=LF.filas[+t.dataset.lfcarp];f.id=t.value;f.manual=true;f.error='';if(f.file)f.estado='listo';return pintarLF()}
  if(t.dataset.lffec!==undefined){LF.filas[+t.dataset.lffec].fecha=t.value;return}
  if(t.dataset.lfdocfecha!==undefined){LF.filas[+t.dataset.lfdocfecha].fechaDocumento=t.value;return}
  if(t.dataset.lfdocumento!==undefined){LF.filas[+t.dataset.lfdocumento].documento=t.value;return}
  if(t.id==='lfTipo'){if(LF.filas.length&&!confirm('Hay archivos pendientes. ¿Vaciar esta lista para cambiar el tipo? Los guardados se conservan.'))return pintarLF();LF.tipo=t.value;LF.filas=[];LF.hecho='';return pintarLF()}
  if(t.id==='lfFecha'){LF.fecha=t.value;for(const f of LF.filas)f.fecha=t.value;return pintarLF()}
  if(t.dataset.vf){setField(t.dataset.vid,t.dataset.vf,t.value);return}
  if(t.id==='efBuscar'){
    const q=nrm(t.value);
    for(const f of document.querySelectorAll('.ef-tabla tbody tr'))f.hidden=!nrm([...f.querySelectorAll('input')].map(i=>i.value).join(' ')).includes(q);
    return;
  }
  if(t.dataset.eff){
    const ef=store.efectivos.find(x=>x.id===t.closest('[data-ef]').dataset.ef);
    ef[t.dataset.eff]=t.type==='checkbox'?t.checked:t.value;save();return;
  }
  if(t.dataset.elegir){
    if(!L.elegidos)L.elegidos=new Set();
    if(t.checked)L.elegidos.add(t.dataset.elegir);else L.elegidos.delete(t.dataset.elegir);
    return;
  }
  if(t.dataset.lf){
    const f=L.filas[+t.closest('[data-fila]').dataset.fila];
    f[t.dataset.lf]=t.value;
    if(f.modo==='amp'&&['dest','dias','unidad','desde','fofi','vamp'].includes(t.dataset.lf)){
      if(t.dataset.lf==='vamp'){f.vampManual=true;return}

      return vLote();
    }
    if(t.dataset.lf==='plazo'&&!f.vencManual){f.venc=vencSugerido(f,L.fecha);const v=t.closest('[data-fila]').querySelector('[data-lf=venc]');if(v)v.value=f.venc}
    if(t.dataset.lf==='venc')f.vencManual=true;
    return;
  }
  if(t.id==='loteFecha'){L.fecha=t.value;if(L.filas.some(f=>f.modo==='amp'&&f.desde==='rec')){L.filas.forEach(f=>f.modo==='amp'&&calcularAmpliacion(f));vLote()}return}
  if(t.id==='loteHora'){L.hora=t.value;return}
  if(t.id==='sigDec'){store.cfg.sigDec=Math.max(1,+t.value||1);save();return}
  if(t.id==='sigMemo'){store.cfg.sigMemo=Math.max(1,+t.value||1);save();return}
  if(t.dataset.k&&S.cur){
    setField(S.cur,t.dataset.k,t.value);
    if(t.classList.contains('bad')&&isISO(t.value))t.classList.remove('bad');
    estado();hoja();ajustarHoja();
  }else if(t.dataset.cfg){
    store.cfg[t.dataset.cfg]=t.value;save();hoja();ajustarHoja();
  }else if(t.id==='q'){S.q=t.value;S.page=0;tabla()}
  else if(t.id==='fsec'){S.sec=t.value;S.page=0;tabla()}
  else if(t.id==='fhoja'){S.hoja=t.value;S.page=0;tabla()}
  else if(t.id==='fvig'){S.vig=t.value;S.page=0;tabla()}
  else if(t.id==='decQ'){S.decQ=t.value;listaDec()}
  else if(t.id==='fetapa'){S.etapa=t.value;S.page=0;tabla()}
  else if(t.id==='recFiltro'){S.recFiltro=t.value;pintarRecibidos()}
  else if(t.id==='forden'){S.orden=t.value;S.page=0;tabla()}
  else if(t.id==='estAnio'){S.estAnio=t.value;vEstadistica()}
  else if(t.id==='estMes'){S.estMes=t.value;vEstadistica()}
  else if(t.id==='estSec'){S.estSec=t.value;vEstadistica()}
  else if(t.id==='cControl'){store.cfg.control=t.value;save();actualizarControl()}
  else if(t.id==='cAviso'){store.cfg.aviso=Math.min(365,Math.max(0,Math.trunc(+t.value||0)));save()}
}

function tarjetas(){
  for(const tr of document.querySelectorAll('#app tr.go')){tr.tabIndex=0;tr.setAttribute('aria-label','Abrir: '+tr.textContent.trim().slice(0,120))}
  for(const t of document.querySelectorAll('#app table:not([data-tj])')){
    t.dataset.tj='';
    if(t.classList.contains('no-tarjeta'))continue;
    const th=[...t.querySelectorAll('thead th')];
    if(th.length<4||th.filter(h=>h.classList.contains('num')).length>2)continue;
    t.classList.add('tarjetas');
  }
  for(const t of document.querySelectorAll('#app table.tarjetas')){
    const th=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    for(const tr of t.querySelectorAll('tbody tr:not([data-tj])')){tr.dataset.tj='';[...tr.children].forEach((td,i)=>{if(th[i])td.dataset.l=th[i]})}
  }
}
